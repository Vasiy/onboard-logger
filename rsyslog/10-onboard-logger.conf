# The board's own events, in plain text.
#
# DiagLog mirrors every non-HLT/KMSG record (link_up/link_down, log_open/log_close)
# to journald as well as to diag-<ts>.log, and this file is the third copy. It
# earns its place twice over: the diag file exists only while a ride log is open,
# so an event outside a ride has no other home; and a power cut can leave the
# binary journal truncated where a plain-text line survives — which is how the
# 2026-08-26 cut was read afterwards.
#
# Narrow on purpose. The stock 50-default.conf routes *.* into /var/log/syslog,
# writing every line to the SD card a second time for no added safety; install.sh
# comments that rule out and leaves this one.
:programname, isequal, "uvicorn"    /var/log/onboard-logger.log
& stop
