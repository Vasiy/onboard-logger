# Drop-in for the distribution's hostapd.service.
# install.sh puts this at /etc/systemd/system/hostapd.service.d/override.conf.
#
# ConditionPathExists is the important line. With no Wi-Fi dongle there is no
# wlan0, and the ExecStartPre below then waits its full 30 s — inside
# multi-user.target, so the whole boot waits with it — only to fail and, with
# Restart=always, do it again forever. The condition makes systemd skip the unit
# instead. It is re-evaluated at every start, so `systemctl enable hostapd` from
# ConfigManager stays correct, and udev's 71-wlan-hostapd-restart.rules brings
# the AP up the moment the dongle enumerates. The start limit is the backstop.
#
# The ExecStartPre itself stays: with a dongle present it returns as soon as
# `iw dev wlan0 info` answers, and it covers the interface existing while the
# driver is still settling.
[Unit]
ConditionPathExists=/sys/class/net/wlan0
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=always
RestartSec=3
ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do iw dev wlan0 info >/dev/null 2>&1 && exit 0; sleep 1; done; exit 0'
ExecStartPost=-/sbin/iw dev wlan0 set power_save off
ExecStartPost=-/sbin/iw dev wlan0 set txpower fixed 1500
